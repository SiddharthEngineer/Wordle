<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle solver</title>
  <meta name="description" content="Type your Wordle guesses, set the tile colors, and see every word still possible with how likely it is and how well it splits the rest.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236aaa64'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
  <!-- The engineerfamily site header (services/shared in the engineerfamily repo); nginx serves /shared/ on the same host. -->
  <script src="/shared/site-header.js" defer></script>
  <style>
    /* Sunrise theme, the same tokens as engineerfamily's Strelitzia pages. */
    :root {
      --bg: #fbf6ee; --fg: #2a1f17; --muted: #6b5e52; --accent: #e8711a; --link: #3a3fa8; --rule: #e4d8c6; --code: #f5ede0;
      --glow: #f2b33d;
      --black: #3a3a3c; --yellow: #c9b458; --green: #6aaa64; --key: #e4d8c6; --key-fg: #2a1f17;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14122b; --fg: #f3eee6; --muted: #b4aecb; --accent: #ff9a3c; --link: #8f95ff; --rule: #3a3566; --code: #27234a;
        --key: #3a3566; --key-fg: #f3eee6; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      background-image: radial-gradient(ellipse 90% 320px at 50% -120px, color-mix(in srgb, var(--glow) 28%, transparent), transparent);
      background-repeat: no-repeat;
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--link); }
    .page-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--fg); text-decoration: none; }
    .brand-tile { width: 24px; height: 24px; border-radius: 4px; background: var(--green); color: #fff; display: inline-grid;
      place-items: center; font-size: 15px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 16px 0 8px; }
    h1 .accent { color: var(--accent); }
    .lede { color: var(--muted); margin: 0 0 24px; }

    /* Grid */
    #grid { display: grid; gap: 6px; justify-content: center; margin: 0 auto 12px; }
    .row { display: grid; grid-template-columns: repeat(5, 56px); gap: 6px; }
    .row.shake { animation: shake 0.4s; }
    @keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .row.shake { animation: none; } }
    .tile { width: 56px; height: 56px; border: 2px solid var(--rule); border-radius: 4px; display: grid; place-items: center;
      font: 700 28px/1 system-ui, sans-serif; text-transform: uppercase; color: #fff; padding: 0; background: transparent; }
    .row.active .tile:not(button) { border-color: color-mix(in srgb, var(--muted) 45%, var(--rule)); }
    button.tile { cursor: pointer; border-color: transparent; }
    button.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .c0 { background: var(--black); }
    .c1 { background: var(--yellow); }
    .c2 { background: var(--green); }
    .row.active button.tile { box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.25); }

    #status { min-height: 1.6em; text-align: center; font-weight: 600; margin: 0 0 8px; }
    .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
    .btn { font: 600 16px/1 system-ui, sans-serif; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--rule);
      background: var(--code); color: var(--fg); cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn:focus-visible, .key:focus-visible, th button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

    /* On-screen keyboard */
    #keyboard { display: grid; gap: 6px; max-width: 500px; margin: 0 auto 32px; user-select: none; }
    .krow { display: flex; gap: 5px; justify-content: center; }
    .key { flex: 1 1 0; min-width: 0; max-width: 44px; height: 52px; border: 0; border-radius: 5px; background: var(--key);
      color: var(--key-fg); font: 700 15px/1 system-ui, sans-serif; text-transform: uppercase; cursor: pointer; padding: 0; }
    .key.wide { max-width: 68px; flex-grow: 1.5; font-size: 12px; }
    .key.c0 { background: var(--black); color: #fff; }
    .key.c1 { background: var(--yellow); color: #fff; }
    .key.c2 { background: var(--green); color: #fff; }

    /* Results */
    #results h2 { font-size: 20px; margin: 0 0 8px; }
    .note { color: var(--muted); margin: 0 0 12px; }
    .table-box { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    td:first-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.05em; }
    tbody tr:last-child td { border-bottom: 0; }
    th { background: var(--code); font-size: 15px; }
    th button { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    th[aria-sort] button::after { content: " \2193"; color: var(--accent); }
    th[aria-sort="ascending"] button::after { content: " \2191"; }
    #more { margin-top: 12px; }
    dl.legend { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
    dl.legend dt { font-weight: 700; color: var(--fg); }
    dl.legend dd { margin: 0 0 6px; }

    @media (max-width: 420px) {
      main { padding: 16px 12px 48px; }
      .row { grid-template-columns: repeat(5, 52px); gap: 5px; }
      #grid { gap: 5px; }
      .tile { width: 52px; height: 52px; font-size: 26px; }
      .krow { gap: 4px; }
      .key { height: 50px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
<ef-site-header></ef-site-header>
<main>
  <div class="page-row">
    <a class="brand" href="./"><span class="brand-tile" aria-hidden="true">W</span><span>Wordle solver</span></a>
    <a href="https://github.com/SiddharthEngineer/Wordle">GitHub</a>
  </div>

  <h1>Which <span class="accent">words</span> are still possible?</h1>
  <p class="lede">Type each guess, click its tiles to match the colors Wordle gave you (one click yellow, two green,
    three back to black), then press Submit.</p>

  <div id="grid" role="group" aria-label="Guesses"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="controls">
    <button type="button" class="btn primary" id="submit">Submit</button>
    <button type="button" class="btn" id="reset">Reset</button>
  </div>
  <div id="keyboard" role="group" aria-label="Keyboard"></div>

  <section id="results"></section>
</main>
<script src="static/app.js" defer></script>
</body>
</html>
